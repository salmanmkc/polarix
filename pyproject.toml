[project]
# Project metadata. Available keys are documented at:
# https://packaging.python.org/en/latest/specifications/declaring-project-metadata
name = "polarix"
description = "A library for game-theoretic evaluation and ratings."
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [{name = "polarix authors", email="polarix@google.com"}]
classifiers = [  # List of https://pypi.org/classifiers/
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Science/Research",
]
keywords = []

# pip dependencies of the project
# Installed locally with `pip install -e .`
dependencies = [
    "absl-py",
    "altair",
    "chex",
    "distrax",
    "optax",
    "frozendict",
    "jax",
    "numpy",
    "pandas",
    "tqdm",
]

# `version` is automatically set by flit to use `polarix.__version__`
dynamic = ["version"]

[project.urls]
homepage = "https://github.com/google-deepmind/polarix"
repository = "https://github.com/google-deepmind/polarix"
changelog = "https://github.com/google-deepmind/polarix/blob/main/CHANGELOG.md"
documentation = "https://github.com/google-deepmind/polarix/blob/main/README.md"

[project.optional-dependencies]
# Development deps (unittest, linting, formating,...)
# Installed through `pip install -e .[dev]`
dev = [
    "etils[epath]",
    "pyink",
    "pylint>=2.6.0",
    "pytest",
    "pytest-xdist",
]

[tool.pyink]
# Formatting configuration to follow Google style-guide
line-length = 80
unstable = true
pyink-indentation = 2
pyink-use-majority-quotes = true

[build-system]
# Build system specify which backend is used to build/install the project (flit,
# poetry, setuptools,...). All backends are supported by `pip install`
requires = ["flit_core >=3.8,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.sdist]
# Flit specific options (files to exclude from the PyPI package).
# If using another build backend (setuptools, poetry), you can remove this
# section.
exclude = [
  # Do not release tests files on PyPI
  "**/*_test.py",
]
